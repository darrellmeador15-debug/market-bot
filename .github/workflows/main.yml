name: Test Market Bot

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Python files
        run: python -m py_compile config.py scanner.py strategy.py backtest.py main.py

      - name: Run Market Bot
        run: python main.py
